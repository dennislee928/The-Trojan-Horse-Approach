<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" fill="none">
  <rect width="1400" height="980" fill="#f3f6fb"/>
  <rect x="58" y="52" width="1284" height="876" rx="28" fill="#ffffff" stroke="#d8e1ef" stroke-width="2"/>
  <rect x="58" y="52" width="1284" height="82" rx="28" fill="#f6821f"/>
  <text x="116" y="102" fill="#fff8f1" font-family="Arial, sans-serif" font-size="28" font-weight="700">Cloudflare Rules - Redirect Rules</text>
  <rect x="110" y="188" width="1180" height="690" rx="24" fill="#fffaf5" stroke="#f3d6bb" stroke-width="2"/>
  <text x="142" y="244" fill="#3a4a62" font-family="Arial, sans-serif" font-size="30" font-weight="700">Root to www redirect</text>
  <text x="142" y="282" fill="#6b7b93" font-family="Arial, sans-serif" font-size="22">Use this when example.com should forward all traffic to www.example.com.</text>
  <rect x="142" y="336" width="1116" height="134" rx="18" fill="#ffffff" stroke="#d7e0ec" stroke-width="2"/>
  <text x="170" y="378" fill="#6b7b93" font-family="Arial, sans-serif" font-size="20">If incoming requests match</text>
  <text x="170" y="432" fill="#22324a" font-family="Arial, sans-serif" font-size="32" font-weight="700">https://example.com/*</text>
  <rect x="142" y="506" width="1116" height="170" rx="18" fill="#ffffff" stroke="#d7e0ec" stroke-width="2"/>
  <text x="170" y="548" fill="#6b7b93" font-family="Arial, sans-serif" font-size="20">Then forward to</text>
  <text x="170" y="606" fill="#22324a" font-family="Arial, sans-serif" font-size="32" font-weight="700">https://www.example.com/${1}</text>
  <text x="170" y="646" fill="#4d5f79" font-family="Arial, sans-serif" font-size="22">Status code: 301     Preserve query string: enabled</text>
  <rect x="142" y="714" width="690" height="96" rx="18" fill="#ebf5ff" stroke="#9ec7f0" stroke-width="2"/>
  <text x="170" y="754" fill="#245a93" font-family="Arial, sans-serif" font-size="20">Important</text>
  <text x="170" y="790" fill="#245a93" font-family="Arial, sans-serif" font-size="24" font-weight="700">Redirect Rules need the hostname record to be proxied in Cloudflare.</text>
  <rect x="920" y="732" width="338" height="78" rx="18" fill="#f6821f"/>
  <text x="992" y="780" fill="#ffffff" font-family="Arial, sans-serif" font-size="28" font-weight="700">Save and deploy</text>
  <path d="M1000 324C1048 264 1110 242 1186 242" stroke="#f6821f" stroke-width="8" stroke-linecap="round"/>
  <circle cx="1198" cy="242" r="16" fill="#f6821f"/>
  <rect x="972" y="176" width="248" height="74" rx="18" fill="#fff1e5"/>
  <text x="998" y="220" fill="#995200" font-family="Arial, sans-serif" font-size="22" font-weight="700">Match the apex domain only</text>
</svg>
