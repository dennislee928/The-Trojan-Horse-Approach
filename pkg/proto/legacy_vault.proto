syntax = "proto3";

package trojanhorse.v1;

option go_package = "github.com/dennislee928/the-trojan-horse-approach/pkg/proto/trojanhorsev1";

message Beneficiary {
  string name = 1;
  string relationship = 2;
  string email = 3;
}

message DigitalWillGuide {
  string full_name = 1;
  string legacy_contact = 2;
  repeated string assets = 3;
  repeated Beneficiary beneficiaries = 4;
  string instructions = 5;
}

message TimeCapsulePayload {
  string title = 1;
  string recipient = 2;
  string deliver_on = 3;
  string unlock_rule = 4;
  string message = 5;
}

message EnvelopeRequest {
  string kind = 1;
  bytes payload_json = 2;
}

message EnvelopeResponse {
  string envelope_id = 1;
  string algorithm = 2;
  string storage_status = 3;
  string cipher_preview = 4;
  string sealed_at = 5;
  string nonce = 6;
  string ciphertext = 7;
}

message DecryptionRequest {
  string kind = 1;
  string nonce = 2;
  string ciphertext = 3;
}

message DecryptionResponse {
  bytes payload_json = 1;
}

service VaultService {
  rpc SealEnvelope(EnvelopeRequest) returns (EnvelopeResponse);
  rpc DecryptEnvelope(DecryptionRequest) returns (DecryptionResponse);
}

